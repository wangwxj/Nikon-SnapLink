name: snaplink
description: "SnapLink - Pro Nikon Camera Wireless Tethering, LiveView, Transfer & Watermark Studio"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  image: ^4.1.7
  exif: ^3.3.0
  intl: ^0.19.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/snaplink_logo.svg
    - assets/icons/snaplink_logo.png
