# SnapLink - 云端构建 Android 安装包
# 用法：Fork 仓库后，在 GitHub 网页新建文件 .github/workflows/build-apk.yml，
# 把本文件内容粘贴进去提交；然后在 Actions 页手动运行 "Build Android APK"。
# 运行成功后在页面底部下载 SnapLink-1.3.0-APK 压缩包，里面就是可直接安装的 APK。

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与仓库自带 CI 保持一致（3.47.7 / Dart 3.13.5，2026-10-08 稳定版）
          # 如需升级到更新的 SDK，删掉下面这一行即可自动使用最新 stable
          flutter-version: 3.47.7
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 整理产物
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/SnapLink-1.3.0.apk
          cd output
          sha256sum SnapLink-1.3.0.apk > SnapLink-1.3.0.apk.sha256
          ls -lh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapLink-1.3.0-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
